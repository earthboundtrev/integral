# PR test builds (7-day artifact) and v* tag release builds (GitHub Release assets).
name: Windows EXE (PR)

on:
  pull_request:
    branches: [main]
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: >-
    ${{
      github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        && format('release-{0}', github.ref)
        || format('windows-exe-{0}', github.event.pull_request.number || github.run_id)
    }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    env:
      INTEGRAL_WINDOWS_EXE_CI: "1"
      INTEGRAL_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      INTEGRAL_PR_NUMBER: ${{ github.event.pull_request.number }}
      INTEGRAL_TAG_NAME: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
      INTEGRAL_IS_TAG_RELEASE: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && '1' || '' }}
    outputs:
      integral_version: ${{ steps.release_meta.outputs.integral_version }}
      integral_prerelease: ${{ steps.release_meta.outputs.integral_prerelease }}
      integral_asset_exe: ${{ steps.release_meta.outputs.integral_asset_exe }}
      integral_asset_sha: ${{ steps.release_meta.outputs.integral_asset_sha }}
      release_artifact_name: ${{ steps.release_bundle.outputs.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Validate release tag (tag push only)
        if: env.INTEGRAL_IS_TAG_RELEASE == '1'
        id: release_meta
        shell: pwsh
        run: ./scripts/ci_validate_release_tag.ps1

      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        if: env.INTEGRAL_IS_TAG_RELEASE != '1' || steps.release_meta.outcome == 'success'
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-build.txt -r requirements-ai.txt

      - name: Configure Tcl/Tk for GitHub Actions
        if: env.INTEGRAL_IS_TAG_RELEASE != '1' || steps.release_meta.outcome == 'success'
        shell: pwsh
        run: |
          $tclRoot = python -c "import sys, pathlib; print(pathlib.Path(sys.base_prefix) / 'tcl')"
          $tcl = Join-Path $tclRoot 'tcl8.6'
          $tk = Join-Path $tclRoot 'tk8.6'
          "TCL_LIBRARY=$tcl" >> $env:GITHUB_ENV
          "TK_LIBRARY=$tk" >> $env:GITHUB_ENV

      - name: Run pytest
        if: env.INTEGRAL_IS_TAG_RELEASE != '1' || steps.release_meta.outcome == 'success'
        run: python -m pytest tests/ -q --timeout=180

      - name: Build onefile exe (production release)
        if: env.INTEGRAL_IS_TAG_RELEASE == '1' && steps.release_meta.outcome == 'success'
        shell: pwsh
        run: ./build-onefile.ps1

      - name: Verify production bundle
        if: env.INTEGRAL_IS_TAG_RELEASE == '1' && steps.release_meta.outcome == 'success'
        run: python scripts/ci_verify_production_exe.py dist/Integral.exe

      - name: Build onefile exe (CI test data folder)
        if: env.INTEGRAL_IS_TAG_RELEASE != '1'
        shell: pwsh
        env:
          INTEGRAL_CI_BUILD: "1"
        run: ./build-onefile.ps1

      - name: Smoke test exe (test-data folder)
        if: steps.release_meta.outcome == 'success' || env.INTEGRAL_IS_TAG_RELEASE != '1'
        shell: pwsh
        run: ./scripts/ci_smoke_windows_exe.ps1 -ExePath dist/Integral.exe -Seconds 20

      - name: Package release assets
        if: env.INTEGRAL_IS_TAG_RELEASE == '1' && steps.release_meta.outcome == 'success'
        shell: pwsh
        env:
          INTEGRAL_APP_VERSION: ${{ steps.release_meta.outputs.integral_version }}
        run: ./scripts/ci_package_release_exe.ps1 -AppVersion $env:INTEGRAL_APP_VERSION

      - name: Bundle artifact files (BUILD.txt, Run-Test.cmd)
        if: env.INTEGRAL_IS_TAG_RELEASE != '1'
        id: artifact
        shell: pwsh
        run: ./scripts/ci_bundle_pr_build.ps1

      - name: Release bundle artifact name
        if: env.INTEGRAL_IS_TAG_RELEASE == '1' && steps.release_meta.outcome == 'success'
        id: release_bundle
        shell: pwsh
        env:
          INTEGRAL_TAG_NAME: ${{ env.INTEGRAL_TAG_NAME }}
        run: |
          $name = "integral-release-$($env:INTEGRAL_TAG_NAME)"
          "name=$name" >> $env:GITHUB_OUTPUT

      - name: Upload PR build bundle
        if: env.INTEGRAL_IS_TAG_RELEASE != '1'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: |
            dist/Integral.exe
            dist/BUILD.txt
            dist/Run-Test.cmd
          retention-days: 7
          if-no-files-found: error

      - name: Upload release build bundle
        if: env.INTEGRAL_IS_TAG_RELEASE == '1' && steps.release_meta.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.release_bundle.outputs.name }}
          path: |
            dist/Integral-v*.exe
            dist/Integral-v*.exe.sha256
          retention-days: 1
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      INTEGRAL_TAG_NAME: ${{ github.ref_name }}
      INTEGRAL_ASSET_EXE: ${{ needs.build.outputs.integral_asset_exe }}
      INTEGRAL_ASSET_SHA: ${{ needs.build.outputs.integral_asset_sha }}
      INTEGRAL_PRERELEASE: ${{ needs.build.outputs.integral_prerelease }}
      INTEGRAL_ARTIFACT_NAME: ${{ needs.build.outputs.release_artifact_name }}
    steps:
      - name: Download release build artifact
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: ${{ env.INTEGRAL_ARTIFACT_NAME }}
          path: release-assets

      - name: Publish GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${INTEGRAL_TAG_NAME}"
          exe="${INTEGRAL_ASSET_EXE}"
          sha="${INTEGRAL_ASSET_SHA}"
          asset_dir="release-assets/dist"
          if [ ! -f "${asset_dir}/${exe}" ] || [ ! -f "${asset_dir}/${sha}" ]; then
            echo "Missing release assets under ${asset_dir}"
            ls -la release-assets || true
            exit 1
          fi
          if ! gh release view "${tag}" >/dev/null 2>&1; then
            prerelease_flag=""
            if [ "${INTEGRAL_PRERELEASE}" = "true" ]; then
              prerelease_flag="--prerelease"
            fi
            gh release create "${tag}" --title "Integral ${tag#v}" ${prerelease_flag} --notes "Automated Windows release build."
          fi
          gh release upload "${tag}" "${asset_dir}/${exe}" "${asset_dir}/${sha}" --clobber
