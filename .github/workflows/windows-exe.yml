# Build a one-file Windows Integral.exe on every PR to main (artifact for manual QA).
name: Windows EXE (PR)

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-exe:
    runs-on: windows-latest
    env:
      INTEGRAL_WINDOWS_EXE_CI: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-build.txt -r requirements-ai.txt

      - name: Configure Tcl/Tk for GitHub Actions
        shell: pwsh
        run: |
          $tclRoot = python -c "import sys, pathlib; print(pathlib.Path(sys.base_prefix) / 'tcl')"
          $tcl = Join-Path $tclRoot 'tcl8.6'
          $tk = Join-Path $tclRoot 'tk8.6'
          "TCL_LIBRARY=$tcl" >> $env:GITHUB_ENV
          "TK_LIBRARY=$tk" >> $env:GITHUB_ENV

      - name: Run pytest
        run: python -m pytest tests/ -q --timeout=180

      - name: Build onefile exe (CI test data folder)
        shell: pwsh
        env:
          INTEGRAL_CI_BUILD: "1"
        run: ./build-onefile.ps1

      - name: Smoke test exe (test-data folder)
        shell: pwsh
        run: ./scripts/ci_smoke_windows_exe.ps1 -ExePath dist/Integral.exe -Seconds 20

      - name: Bundle artifact files (BUILD.txt, Run-Test.cmd)
        shell: pwsh
        run: |
          $pr = '${{ github.event.pull_request.number }}'
          if (-not $pr) { $pr = 'manual' }
          $built = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ss'Z'")
          @(
            "pull_request: $pr",
            "commit: $env:GITHUB_SHA",
            "built_utc: $built",
            "data_folder_default: %APPDATA%\Integral-test",
            "run_test_cmd: sets INTEGRAL_DATA_DIR=%TEMP%\Integral-RunTest"
          ) | Set-Content -Path dist/BUILD.txt -Encoding utf8
          Copy-Item -Path scripts/Run-Test.cmd -Destination dist/Run-Test.cmd

      - name: Artifact name
        id: artifact
        shell: pwsh
        run: |
          $pr = '${{ github.event.pull_request.number }}'
          if (-not $pr) { $pr = 'manual' }
          $short = $env:GITHUB_SHA.Substring(0, 7)
          $name = "integral-pr${pr}-${short}"
          "name=$name" >> $env:GITHUB_OUTPUT

      - name: Upload PR build bundle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: |
            dist/Integral.exe
            dist/BUILD.txt
            dist/Run-Test.cmd
          retention-days: 7
          if-no-files-found: error
