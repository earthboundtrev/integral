# Build a one-file Windows Integral.exe on every PR to main (artifact for manual QA).
name: Windows EXE (PR)

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-exe:
    runs-on: windows-latest
    env:
      INTEGRAL_WINDOWS_EXE_CI: "1"
      INTEGRAL_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      INTEGRAL_PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-build.txt -r requirements-ai.txt

      - name: Configure Tcl/Tk for GitHub Actions
        shell: pwsh
        run: |
          $tclRoot = python -c "import sys, pathlib; print(pathlib.Path(sys.base_prefix) / 'tcl')"
          $tcl = Join-Path $tclRoot 'tcl8.6'
          $tk = Join-Path $tclRoot 'tk8.6'
          "TCL_LIBRARY=$tcl" >> $env:GITHUB_ENV
          "TK_LIBRARY=$tk" >> $env:GITHUB_ENV

      - name: Run pytest
        run: python -m pytest tests/ -q --timeout=180

      - name: Build onefile exe (CI test data folder)
        shell: pwsh
        env:
          INTEGRAL_CI_BUILD: "1"
        run: ./build-onefile.ps1

      - name: Smoke test exe (test-data folder)
        shell: pwsh
        run: ./scripts/ci_smoke_windows_exe.ps1 -ExePath dist/Integral.exe -Seconds 20

      - name: Bundle artifact files (BUILD.txt, Run-Test.cmd)
        id: artifact
        shell: pwsh
        run: ./scripts/ci_bundle_pr_build.ps1

      - name: Upload PR build bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: |
            dist/Integral.exe
            dist/BUILD.txt
            dist/Run-Test.cmd
          retention-days: 7
          if-no-files-found: error
